<!DOCTYPE html>
<html>
<head>
<title>Royal Cabz</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

/* BODY */
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:white;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* ===== HEADER ===== */
.main-header{
  width:100%;
  height:220px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:white;
  position:relative;
  overflow:hidden;

  background:linear-gradient(to bottom, #000000, #111111, transparent);
}

/* Faded logo */
.main-header::before{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background-image:url("logo.png"); /* or images/logo.png */
  background-size:cover;
  background-position:center;
  opacity:0.08;
}

.header-content{
  position:relative;
  z-index:1;
}

.header-content h1{
  margin:0;
  font-size:26px;
}

.header-content p{
  margin-top:5px;
  font-size:14px;
  color:#ccc;
}

/* ===== FORM ===== */
.container{
  width:90%;
  max-width:350px;
  background:white;
  padding:25px;
  border-radius:12px;
  box-shadow:0 15px 40px rgba(0,0,0,0.2);
  margin-top:-40px;
}

h2{
  text-align:center;
}

input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:6px;
  border:1px solid #ccc;
  font-size:16px;
}

/* Trip Toggle */
.trip-type{
  display:flex;
  gap:10px;
  margin:15px 0;
}

.toggle{
  flex:1;
  padding:10px;
  text-align:center;
  border:2px solid #ddd;
  border-radius:8px;
  cursor:pointer;
  background:#f9f9f9;
}

.toggle.active{
  background:#2193b0;
  color:white;
}

/* Cab */
.cabs{
  display:flex;
  justify-content:space-between;
}

.cab{
  width:30%;
  padding:10px;
  text-align:center;
  border:2px solid #ddd;
  border-radius:8px;
  cursor:pointer;
  position:relative;
}

.cab.selected{
  border-color:#2193b0;
  background:#eaf7fb;
}

.cab img{
  width:60px;
}

/* Tick */
.tick{
  position:absolute;
  top:5px;
  right:5px;
  background:#2193b0;
  color:white;
  border-radius:50%;
  width:20px;
  height:20px;
  display:none;
  align-items:center;
  justify-content:center;
}

.cab.selected .tick{
  display:flex;
}

/* Button */
button{
  width:100%;
  padding:12px;
  background:#ffc107;
  border:none;
  border-radius:6px;
  font-size:16px;
  margin-top:15px;
  cursor:pointer;
}

/* ===== ROUTES ===== */
.routes{
  width:90%;
  max-width:500px;
  margin:30px auto;
}

.route-card{
  background:#fff;
  padding:15px;
  margin-bottom:15px;
  border-radius:10px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.route-info h3{
  margin:0;
  font-size:16px;
}

.price{
  font-weight:bold;
  margin:5px 0;
}

.route-card button{
  width:auto;
  padding:8px 12px;
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="main-header">
  <div class="header-content">
    <h1>Royal Cabz 🚕</h1>
    <p>Karur's Trusted Taxi Service</p>
  </div>
</div>

<!-- FORM -->
<div class="container">

<h2>Book Your Ride</h2>

<div class="trip-type">
  <div class="toggle active" onclick="selectTrip(this,'Airport')">Airport</div>
  <div class="toggle" onclick="selectTrip(this,'One Way')">One Way</div>
  <div class="toggle" onclick="selectTrip(this,'Round Trip')">Round Trip</div>
</div>

<input id="name" placeholder="Your Name">
<input id="phone" placeholder="Phone Number">
<input id="pickup" placeholder="Pickup Location">
<input id="drop" placeholder="Drop Location">

<div class="cabs">
  <div class="cab selected" onclick="selectCab(this,'Mini')">
    <div class="tick">✓</div>
    <img src="https://img.icons8.com/color/96/car.png">
    <p>Mini</p>
  </div>

  <div class="cab" onclick="selectCab(this,'Sedan')">
    <div class="tick">✓</div>
    <img src="https://img.icons8.com/color/96/sedan.png">
    <p>Sedan</p>
  </div>

  <div class="cab" onclick="selectCab(this,'SUV')">
    <div class="tick">✓</div>
    <img src="https://img.icons8.com/color/96/suv.png">
    <p>SUV</p>
  </div>
</div>

<button onclick="bookCab()">Book via WhatsApp</button>

</div>

<!-- ROUTES -->
<div class="routes">

<h2>Popular Routes from Karur</h2>

<!-- SAMPLE (repeat same pattern for all 20 if needed) -->
<div class="route-card">
  <div class="route-info">
    <h3>Karur → Trichy Airport Taxi</h3>
    <p class="price">₹2220</p>
    <p>83 KM • Toll Extra</p>
  </div>
  <button onclick="quickBook('Karur','Trichy Airport')">BOOK</button>
</div>

<div class="route-card">
  <div class="route-info">
    <h3>Karur → Chennai Taxi</h3>
    <p class="price">₹5720</p>
    <p>380 KM</p>
  </div>
  <button onclick="quickBook('Karur','Chennai')">BOOK</button>
</div>

</div>

<script>

var selectedCab="Mini";
var selectedTrip="Airport";

function selectCab(el,type){
  selectedCab=type;
  document.querySelectorAll(".cab").forEach(c=>c.classList.remove("selected"));
  el.classList.add("selected");
}

function selectTrip(el,type){
  selectedTrip=type;
  document.querySelectorAll(".toggle").forEach(t=>t.classList.remove("active"));
  el.classList.add("active");
}

function bookCab(){
  let name=name.value, phone=phone.value, pickup=pickup.value, drop=drop.value;

  if(!name||!phone||!pickup||!drop){
    alert("Fill all details"); return;
  }

  let msg=`🚕 Royal Cabz
Trip: ${selectedTrip}
Name: ${name}
Phone: ${phone}
Pickup: ${pickup}
Drop: ${drop}
Cab: ${selectedCab}`;

  window.open("https://wa.me/919488004687?text="+encodeURIComponent(msg));
}

function quickBook(from,to){
  let msg=`🚕 Royal Cabz Booking
Trip: ${from} to ${to}`;
  window.open("https://wa.me/919488004687?text="+encodeURIComponent(msg));
}

</script>

</body>
</html>
